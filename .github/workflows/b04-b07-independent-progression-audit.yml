name: B04/B07 Independent L1-3 Progression Audit

on:
  pull_request:
    paths:
      - 'scripts/b04_b07_independent_progression_audit_v0.py'
      - 'tests/test_b04_b07_independent_progression_audit_v0.py'
      - 'docs/design/b04-b07-independent-l1-l3-build-progression-audit-v0.md'
      - '.github/workflows/b04-b07-independent-progression-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-progression-audit:
    name: Independently audit 12 Focus L1-3 progressions and source authenticity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Attest source head
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Attested progression audit: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional repository schema checks
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Run focused independent progression regressions
        run: python -m unittest discover -s tests -p 'test_b04_b07_independent_progression_audit_v0.py' -v
      - name: Produce machine-readable audit findings
        run: |
          mkdir -p build
          python -m scripts.b04_b07_independent_progression_audit_v0 > build/b04-b07-independent-l1-l3-audit.json
          python -m json.tool build/b04-b07-independent-l1-l3-audit.json > /dev/null
      - name: Run full repository unittest regression suite
        run: python -m unittest discover -s tests -v
      - name: Upload provenance and findings
        uses: actions/upload-artifact@v4
        with:
          name: b04-b07-independent-l1-l3-audit
          path: build/b04-b07-independent-l1-l3-audit.json
          if-no-files-found: error
