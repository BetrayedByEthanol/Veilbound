name: B04/B07 Independent L1-3 Progression Audit

on:
  pull_request:
    paths:
      # Audit code and tests.
      - 'scripts/b04_b07_independent_progression_audit_v0.py'
      - 'scripts/b05_low_priest_life_l1_l3_v0.py'
      - 'scripts/b04_b05_low_priest_complete_noncombat_v0.py'
      - 'scripts/b05_b06_native_party_continuity_v0.py'
      - 'scripts/b05_b06_cross_encounter_effect_continuity_v0.py'
      - 'scripts/b04_b06_b07_integrated_milestone_persistent_party_v0.py'
      - 'scripts/b04_b06_b07_persistent_adventure_acceptance_readiness_v0.py'
      - 'tests/test_b04_b06_b07_persistent_adventure_acceptance_readiness_v0.py'
      - 'docs/design/b04-b06-b07-persistent-adventure-acceptance-certification-readiness-v0.md'
