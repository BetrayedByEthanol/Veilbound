      - 'docs/design/b04-b06-b07-integrated-milestone-persistent-party-adventure-v0.md'
      - 'tests/test_b05_b06_cross_encounter_effect_continuity_v0.py'
      - 'docs/design/b05-b06-cross-encounter-toxin-effect-duration-continuity-v0.md'
      - 'tests/test_b05_b06_native_party_continuity_v0.py'
      - 'docs/design/b05-b06-native-cross-encounter-party-resource-continuity-v0.md'
      - 'tests/test_b04_b05_low_priest_complete_noncombat_v0.py'
      - 'docs/design/b04-b05-low-priest-complete-character-noncombat-v0.md'
      - 'scripts/b04_b07_twelve_focus_certification_protocol_v0.py'
      - 'scripts/b04_b05_focus_combat_noncombat_evidence_v0.py'
      - 'scripts/b04_b05_noncombat_scene_resolution_v0.py'
      - 'scripts/b04_b05_focus_noncombat_technique_integration_v0.py'
      - 'scripts/b05_b06_integrated_noncombat_adventure_v0.py'
      - 'scripts/b06_representative_gm_encounter_packs_v0.py'
      - 'scripts/b04_b05_b06_b07_integrated_pilot_adventure_v0.py'
      - 'scripts/b04_b05_b06_l1_source_native_combat_v0.py'
      - 'tests/test_b04_b05_b06_l1_source_native_combat_v0.py'
      - 'docs/design/b04-b05-b06-l1-source-native-combat-v0.md'
      - 'scripts/b04_b07_pilot_evidence_cohorts_v0.py'
      - 'tests/test_b04_b07_pilot_evidence_cohorts_v0.py'
      - 'docs/design/b04-b07-pilot-evidence-flexibility-multi-cohort-v0.md'
      - 'tests/test_b04_b05_b06_b07_integrated_pilot_adventure_v0.py'
      - 'docs/design/b04-b05-b06-b07-integrated-mvp-pilot-adventure-v0.md'
      - 'tests/test_b06_representative_gm_encounter_packs_v0.py'
      - 'docs/design/b06-representative-soldier-sentry-hunter-gm-encounter-packs-v0.md'
      - 'tests/test_b05_b06_integrated_noncombat_adventure_v0.py'
      - 'docs/design/b05-b06-integrated-noncombat-adventure-scenes-consequences-v0.md'
      - 'tests/test_b04_b05_focus_noncombat_technique_integration_v0.py'
      - 'docs/design/b04-b05-focus-noncombat-technique-integration-v0.md'
      - 'tests/test_b04_b05_noncombat_scene_resolution_v0.py'
      - 'docs/design/b04-b05-source-legal-noncombat-scene-resolution-v0.md'
      - 'tests/test_b04_b05_focus_combat_noncombat_evidence_v0.py'
      - 'docs/design/b04-b05-focus-specific-combat-noncombat-evidence-v0.md'
      - 'tests/test_b04_b07_twelve_focus_certification_protocol_v0.py'
      - 'tests/test_b04_b07_independent_progression_audit_v0.py'
      - '.github/workflows/b04-b07-independent-progression-audit.yml'
      # All eleven directly imported B05 pilot sheets and their B05 helpers.
      - 'scripts/b05_*.py'
      # Low Priest A/B native source and actor construction.
      - 'scripts/b06_hunter_party_exchanges_v0.py'
      - 'scripts/b06_encounter_state_v0.py'
      # Canonical rule inputs for capacities, techniques, talents,
      # Weapon Training families, starter prices and Aspect identities.
      - 'docs/rules/05-combat/**'
      - 'docs/rules/07-veil-magic/**'
      - 'docs/rules/08-archetypes/**'
      - 'docs/rules/10-advancement/**'
      - 'docs/rules/11-equipment/**'
      - 'docs/world/aspect-identities-and-boundaries.md'
      # Audit/acceptance living documents, watched pilot decisions and tests.
      - 'tests/test_b04_b07_mvp_acceptance_register_refresh_v0.py'
      - 'tests/test_b04_b07_mvp_pilot_approvals_v0.py'
      - 'docs/design/veilbound-roadmap-and-mvp-readiness.md'
      - 'docs/design/b04-b07-mvp-acceptance-register-refresh-v0.md'
      - 'docs/design/b04-b07-independent-twelve-focus-certification-protocol-pilot-roster-v0.md'
      - 'docs/design/b04-b05-b07-mvp-pilot-approvals-and-watches-v0.md'
      - 'docs/design/b04-b05-mvp-pilot-roster-gifted-anointed-readiness-v0.md'
      - 'docs/design/README.md'
      # Independent audit and Low Priest A/B source-build evidence.
      - 'docs/design/b04-b07-independent-l1-l3-build-progression-audit-v0.md'
      - 'docs/design/b05-life-low-priest-l3-build-exaltation-verification-v0.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-progression-audit:
    name: Independently audit 12 Focus L1-3 progressions and source authenticity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Attest source head
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Attested progression audit: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional repository schema checks
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Run focused independent progression regressions
        run: python -m unittest discover -s tests -p 'test_b04_b07_independent_progression_audit_v0.py' -v
      - name: Run focused twelve-Focus protocol intake regressions
        run: python -m unittest discover -s tests -p 'test_b04_b07_twelve_focus_certification_protocol_v0.py' -v
      - name: Produce machine-readable structural audit and noncertifying pilot roster
        run: |
          mkdir -p build
          python -m scripts.b04_b07_independent_progression_audit_v0 > build/b04-b07-independent-l1-l3-audit.json
          python -m scripts.b04_b07_twelve_focus_certification_protocol_v0 --roster > build/b04-b07-twelve-focus-candidate-roster.json
          python -m json.tool build/b04-b07-independent-l1-l3-audit.json > /dev/null
          python -m json.tool build/b04-b07-twelve-focus-candidate-roster.json > /dev/null
      - name: Run focused twelve-Focus combat/noncombat evidence regressions
        run: python -m unittest discover -s tests -p 'test_b04_b05_focus_combat_noncombat_evidence_v0.py' -v
      - name: Produce bounded native Focus evidence and noncombat gap matrix
        run: |
          mkdir -p build
          python -m scripts.b04_b05_focus_combat_noncombat_evidence_v0 > build/b04-b05-focus-combat-noncombat-evidence-v0.json
          python -m json.tool build/b04-b05-focus-combat-noncombat-evidence-v0.json > /dev/null
      - name: Run focused canonical noncombat scene resolution regressions
        run: python -m unittest discover -s tests -p 'test_b04_b05_noncombat_scene_resolution_v0.py' -v
      - name: Produce canonical noncombat scene/check receipt matrix
        run: |
          mkdir -p build
          python -m scripts.b04_b05_noncombat_scene_resolution_v0 > build/b04-b05-noncombat-scene-resolution-v0.json
          python -m json.tool build/b04-b05-noncombat-scene-resolution-v0.json > /dev/null
      - name: Run focused source-paid noncombat technique integration regressions
        run: python -m unittest discover -s tests -p 'test_b04_b05_focus_noncombat_technique_integration_v0.py' -v
      - name: Produce native AP-VP noncombat technique evidence
        run: |
          mkdir -p build
          python -m scripts.b04_b05_focus_noncombat_technique_integration_v0 > build/b04-b05-focus-noncombat-techniques-v0.json
          python -m json.tool build/b04-b05-focus-noncombat-techniques-v0.json > /dev/null
      - name: Run focused B05/B06 continuous adventure/scene regressions
        run: python -m unittest discover -s tests -p 'test_b05_b06_integrated_noncombat_adventure_v0.py' -v
      - name: Produce continuous scene/VP/clock consequence evidence
        run: |
          mkdir -p build
          python -m scripts.b05_b06_integrated_noncombat_adventure_v0 > build/b05-b06-integrated-noncombat-adventure-v0.json
          python -m json.tool build/b05-b06-integrated-noncombat-adventure-v0.json > /dev/null
      - name: Run focused Soldier Sentry Hunter native GM pack checks
        run: python -m unittest discover -s tests -p 'test_b06_representative_gm_encounter_packs_v0.py' -v
      - name: Produce source-native GM encounter and aftermath matrix
        run: |
          mkdir -p build
          python -m scripts.b06_representative_gm_encounter_packs_v0 > build/b06-representative-gm-encounter-packs-v0.json
          python -m json.tool build/b06-representative-gm-encounter-packs-v0.json > /dev/null
      - name: Run focused integrated three-to-five-session pilot regressions
        run: python -m unittest discover -s tests -p 'test_b04_b05_b06_b07_integrated_pilot_adventure_v0.py' -v
      - name: Produce source-bound multi-session GM candidate and blank intake
        run: |
          mkdir -p build
          python -m scripts.b04_b05_b06_b07_integrated_pilot_adventure_v0 --sessions 3 > build/b04-b07-mvp-3-session-candidate-v0.json
          python -m scripts.b04_b05_b06_b07_integrated_pilot_adventure_v0 --sessions 4 > build/b04-b07-mvp-4-session-candidate-v0.json
          python -m scripts.b04_b05_b06_b07_integrated_pilot_adventure_v0 --sessions 5 > build/b04-b07-mvp-5-session-candidate-v0.json
          python -m scripts.b04_b05_b06_b07_integrated_pilot_adventure_v0 --sessions 4 --blank-intake > build/b04-b07-mvp-blank-external-play-intake-v0.json
          python -m scripts.b04_b05_b06_b07_integrated_pilot_adventure_v0 --check build/b04-b07-mvp-blank-external-play-intake-v0.json > build/b04-b07-mvp-blank-intake-preflight-v0.json
          for candidate in build/b04-b07-mvp-*v0.json; do python -m json.tool "$candidate" > /dev/null; done
      - name: Run flexible multi-cohort milestone and attribution regressions
        run: python -m unittest discover -s tests -p 'test_b04_b07_pilot_evidence_cohorts_v0.py' -v
      - name: Validate a blank, noncertifying flexible cohort intake
        run: |
          mkdir -p build
          python -m scripts.b04_b07_pilot_evidence_cohorts_v0 --blank-cohort C1 --pairing Priest/High --pairing Scholar/Low > build/b04-b07-blank-flexible-cohort-v0.json
          python -m scripts.b04_b07_pilot_evidence_cohorts_v0 --check build/b04-b07-blank-flexible-cohort-v0.json > build/b04-b07-blank-flexible-cohort-preflight-v0.json
          python -m json.tool build/b04-b07-blank-flexible-cohort-v0.json > /dev/null
          python -m json.tool build/b04-b07-blank-flexible-cohort-preflight-v0.json > /dev/null
      - name: Run Level 1 native Soldier combat/withdrawal regressions
        run: python -m unittest discover -s tests -p 'test_b04_b05_b06_l1_source_native_combat_v0.py' -v
      - name: Produce Level 1 source-native combat and withdrawal receipts
        run: |
          mkdir -p build
          python -m scripts.b04_b05_b06_l1_source_native_combat_v0 > build/b04-b05-b06-l1-source-native-combat-v0.json
          python -m json.tool build/b04-b05-b06-l1-source-native-combat-v0.json > /dev/null
      - name: Run independent Low Priest full-sheet and native utility regressions
        run: python -m unittest discover -s tests -p 'test_b04_b05_low_priest_complete_noncombat_v0.py' -v
      - name: Produce six source-selected Low Priest sheet and paid noncombat receipts
        run: |
          mkdir -p build
          python -m scripts.b04_b05_low_priest_complete_noncombat_v0 > build/b04-b05-low-priest-full-noncombat-v0.json
          python -m json.tool build/b04-b05-low-priest-full-noncombat-v0.json > /dev/null
      - name: Run focused native cross-encounter party state continuity
        run: python -m unittest discover -s tests -p 'test_b05_b06_native_party_continuity_v0.py' -v
      - name: Produce source-bound inherited HP VP wound arrow and recovery evidence
        run: |
          mkdir -p build
          python -m scripts.b05_b06_native_party_continuity_v0 > build/b05-b06-native-party-continuity-v0.json
          python -m json.tool build/b05-b06-native-party-continuity-v0.json > /dev/null
      - name: Verify G4.2/G4.3/G4.4 toxin, Endurance and G3 maintained effect continuity
        run: python -m unittest discover -s tests -p 'test_b05_b06_cross_encounter_effect_continuity_v0.py' -v
      - name: Produce source bound carried toxin, duration and recovery evidence
        run: |
          mkdir -p build
          python -m scripts.b05_b06_cross_encounter_effect_continuity_v0 > build/b05-b06-cross-encounter-effects-v0.json
          python -m json.tool build/b05-b06-cross-encounter-effects-v0.json > /dev/null
      - name: Verify native L1-3 milestone advancement and retained party resources
        run: python -m unittest discover -s tests -p 'test_b04_b06_b07_integrated_milestone_persistent_party_v0.py' -v
      - name: Produce L1-3 milestone and persistent party adventure source evidence
        run: |
          mkdir -p build
          python -m scripts.b04_b06_b07_integrated_milestone_persistent_party_v0 > build/b04-b06-b07-persistent-milestone-adventure-v0.json
          python -m json.tool build/b04-b06-b07-persistent-milestone-adventure-v0.json > /dev/null
      - name: Check twelve Focus and six-gate independent acceptance readiness
        run: python -m unittest discover -s tests -p 'test_b04_b06_b07_persistent_adventure_acceptance_readiness_v0.py' -v
      - name: Produce human pilot gap matrix and three blank multi-cohort packets
        run: |
          mkdir -p build
          python -m scripts.b04_b06_b07_persistent_adventure_acceptance_readiness_v0 > build/b04-b06-b07-acceptance-readiness-v0.json
          python -m scripts.b04_b06_b07_persistent_adventure_acceptance_readiness_v0 --cohort-templates > build/b04-b06-b07-blank-cohorts-v0.json
          python -m json.tool build/b04-b06-b07-acceptance-readiness-v0.json > /dev/null
          python -m json.tool build/b04-b06-b07-blank-cohorts-v0.json > /dev/null
      - name: Run full repository unittest regression suite
        run: python -m unittest discover -s tests -v
      - name: Upload provenance and findings
        uses: actions/upload-artifact@v4
        with:
          name: b04-b07-independent-l1-l3-audit
          path: |
            build/b04-b07-independent-l1-l3-audit.json
            build/b04-b07-twelve-focus-candidate-roster.json
            build/b04-b05-focus-combat-noncombat-evidence-v0.json
            build/b04-b05-noncombat-scene-resolution-v0.json
            build/b04-b05-focus-noncombat-techniques-v0.json
            build/b05-b06-integrated-noncombat-adventure-v0.json
            build/b06-representative-gm-encounter-packs-v0.json
            build/b04-b07-mvp-3-session-candidate-v0.json
            build/b04-b07-mvp-4-session-candidate-v0.json
            build/b04-b07-mvp-5-session-candidate-v0.json
            build/b04-b07-mvp-blank-external-play-intake-v0.json
            build/b04-b07-mvp-blank-intake-preflight-v0.json
            build/b04-b07-blank-flexible-cohort-v0.json
            build/b04-b07-blank-flexible-cohort-preflight-v0.json
            build/b04-b05-b06-l1-source-native-combat-v0.json
            build/b04-b05-low-priest-full-noncombat-v0.json
            build/b05-b06-native-party-continuity-v0.json
            build/b05-b06-cross-encounter-effects-v0.json
            build/b04-b06-b07-persistent-milestone-adventure-v0.json
            build/b04-b06-b07-acceptance-readiness-v0.json
            build/b04-b06-b07-blank-cohorts-v0.json
          if-no-files-found: error
