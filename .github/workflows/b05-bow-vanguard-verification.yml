name: B05 Bow Vanguard Level 1–3 Verification

on:
  pull_request:
    paths:
      - 'scripts/b05_bow_vanguard_l1_l3_v0.py'
      - 'tests/test_b05_bow_vanguard_l1_l3_v0.py'
      - 'scripts/b06_hunter_tactical_diversity_v0.py'
      - 'docs/design/b05-bow-vanguard-l1-l3-build-verification-v0.md'
      - 'docs/design/b06-hunter-tactical-and-party-diversity-v0.md'
      - 'docs/design/veilbound-roadmap-and-mvp-readiness.md'
      - '.github/workflows/b05-bow-vanguard-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bow-vanguard:
    name: Audit legal L1–3 progression and Phase 3 R compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout attested PR head or dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert attested source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Attested source commit: $ACTUAL_SHA"
          echo "Bow Vanguard source commit: \`$ACTUAL_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional schema checks needed by full repository suite
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Run all focused Bow Vanguard tests
        run: python -m unittest discover -s tests -p 'test_b05_bow_vanguard_l1_l3_v0.py' -v
      - name: Generate source-reconciled L1–3 JSON ledger
        run: |
          mkdir -p build
          python -m scripts.b05_bow_vanguard_l1_l3_v0 > build/b05-bow-vanguard-l1-l3.json
          python -m json.tool build/b05-bow-vanguard-l1-l3.json > /dev/null
      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v
      - name: Validate B06 creature footprints remain intact
        run: python -m scripts.validate_b06_footprints
      - name: Preserve level-by-level character ledger
        uses: actions/upload-artifact@v4
        with:
          name: b05-bow-vanguard-l1-l3-ledger
          path: build/b05-bow-vanguard-l1-l3.json
          if-no-files-found: error
