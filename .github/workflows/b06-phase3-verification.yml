name: B06 Phase 3 Census and Rules Verification

on:
  pull_request:
    paths:
      - 'scripts/b06_encounter_state_v0.py'
      - 'scripts/b06_movement_v0.py'
      - 'scripts/b06_ranged_v0.py'
      - 'scripts/b06_spells_v0.py'
      - 'docs/design/b06-g0-shared-encounter-state-and-event-ledger-v0.md'
      - 'docs/design/b06-g1-native-movement-footprint-contact-v0.md'
      - 'docs/design/b06-g2-ranged-legality-cover-projectile-response-v0.md'
      - 'docs/design/b06-g3-projected-spells-vp-maintenance-v0.md'
      - 'scripts/b06_hunter_phase3_report_v0.py'
      - 'scripts/b06_hunter_tactical_diversity_v0.py'
      - 'scripts/b06_hunter_party_exchanges_v0.py'
      - 'scripts/b06_hunter_repeated_exchanges_v0.py'
      - 'tests/**'
      - 'content/creatures/**'
      - 'docs/design/b06-encounter-integration-readiness-audit-v0.md'
      - 'docs/design/b06-hunter-phase3-census-results-v0.md'
      - 'docs/design/b06-hunter-tactical-and-party-diversity-v0.md'
      - 'docs/design/veilbound-roadmap-and-mvp-readiness.md'
      - '.github/workflows/b06-phase3-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b06-phase3:
    name: Verify B06 Phase 3 and full B06 regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit (PR head or dispatch ref)
        uses: actions/checkout@v4
        with:
          # pull_request defaults to refs/pull/<n>/merge; attest the PR HEAD instead.
          # workflow_dispatch has no pull_request payload, so use its event SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source SHA before producing any attestation
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Attested source commit: $ACTUAL_SHA"
          echo "Attested source commit: \`$ACTUAL_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional Draft 2020-12 schema validator for full suite coverage
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Verify focused Phase 3 tactical and report tests
        run: |
          python -m unittest discover -s tests -p 'test_b06_hunter_tactical_diversity_v0.py' -v
          python -m unittest discover -s tests -p 'test_b06_hunter_phase3_report_v0.py' -v
      - name: Verify G0 encounter state and event ledger
        run: python -m unittest discover -s tests -p 'test_b06_encounter_state_v0.py' -v
      - name: Verify G1 physical map, footprint and contact traces
        run: python -m unittest discover -s tests -p 'test_b06_movement_v0.py' -v
      - name: Verify G2 ranged legality, cover and projectile response traces
        run: python -m unittest discover -s tests -p 'test_b06_ranged_v0.py' -v
      - name: Verify G3 projected spells, VP, maintained effects and benchmark casts
        run: python -m unittest discover -s tests -p 'test_b06_spells_v0.py' -v
      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v
      - name: Verify enemy footprints and index geometry
        run: python -m scripts.validate_b06_footprints
      - name: Execute all 4096 Phase 3 windows and write audited reports
        run: |
          python -m scripts.b06_hunter_phase3_report_v0 \
            --json-out build/b06-phase3-census.json \
            --markdown-out build/b06-phase3-census.md
          cat build/b06-phase3-census.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve machine-readable results and audit report
        uses: actions/upload-artifact@v4
        with:
          name: b06-phase3-census
          path: |
            build/b06-phase3-census.json
            build/b06-phase3-census.md
          if-no-files-found: error
